name: Build and release containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string
  push:
    branches:
      - master
    paths:
      - VERSION
      - Dockerfile
      - Dockerfile.windows
      - composer.json
      - composer.lock
      - .github/workflows/release.yml

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}-linux-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Export image digest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.build.outputs.digest }}"
          mkdir -p digests
          printf '%s@%s\n' "$REGISTRY_IMAGE" "${{ steps.build.outputs.digest }}" > "digests/linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-linux-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows Server 2022 AMD64 image
        shell: pwsh
        run: |
          $tag = "$env:REGISTRY_IMAGE`:$env:VERSION-windows-amd64-ltsc2022"
          docker build `
            --file Dockerfile.windows `
            --build-arg "VERSION=$env:VERSION" `
            --label "org.opencontainers.image.revision=${{ github.sha }}" `
            --tag $tag `
            .
          if ($LASTEXITCODE -ne 0) { throw 'Windows image build failed' }
          docker run --rm $tag "C:\php\php.exe" -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows image smoke test failed' }
          $output = docker push $tag 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows image push failed' }
          if ($output -notmatch 'digest:\s*(sha256:[0-9a-f]{64})') { throw 'Unable to read pushed image digest' }
          New-Item -ItemType Directory -Force -Path digests | Out-Null
          "$env:REGISTRY_IMAGE@$($Matches[1])" | Set-Content -NoNewline -Encoding ascii digests\windows-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-windows-amd64
          path: digests/
          if-no-files-found: error
          retention-days: 1

  package-windows-arm64:
    needs: prepare
    runs-on: windows-11-arm
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMPOSER_PROCESS_TIMEOUT: 0
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_mysql, curl, openssl, zip, fileinfo, intl
          ini-values: memory_limit=512M, date.timezone=Asia/Shanghai
          coverage: none
          tools: composer:v2
        env:
          update: true
      - id: runtime
        name: Inspect ARM64 host and PHP runtime
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'This job requires a native Windows ARM64 runner'
          }
          $phpPath = (Get-Command php).Source
          $bytes = [System.IO.File]::ReadAllBytes($phpPath)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $runtimeArch = switch ($machine) {
            0xAA64 { 'arm64' }
            0x8664 { 'x64' }
            0x014c { 'x86' }
            default { throw "Unknown PHP PE machine type: 0x$($machine.ToString('X4'))" }
          }
          php -r "if (version_compare(PHP_VERSION, '8.4.27', '<')) { fwrite(STDERR, 'PHP must be 8.4.27 or newer for security fixes'); exit(1); }"
          if ($LASTEXITCODE -ne 0) { throw 'Insecure or unsupported PHP runtime' }
          "arch=$runtimeArch" >> $env:GITHUB_OUTPUT
          "phpdir=$(Split-Path -Parent $phpPath)" >> $env:GITHUB_OUTPUT
          php -v
          Write-Output "PHP runtime architecture: $runtimeArch"
      - name: Install production dependencies
        shell: pwsh
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          if ($LASTEXITCODE -ne 0) { throw 'Composer install failed' }
          php think --version
          if ($LASTEXITCODE -ne 0) { throw 'ThinkPHP smoke test failed' }
      - name: Assemble Windows ARM64 package
        shell: pwsh
        run: |
          $appDir = Join-Path $env:RUNNER_TEMP "azpanel-$env:VERSION-windows-arm64"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          $excludedDirs = @('.git', '.github', 'runtime', 'storage', 'dist') | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ }
          robocopy $env:GITHUB_WORKSPACE $appDir /E /XD $excludedDirs /XF .env '*.log' /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path (Join-Path $appDir 'runtime'),(Join-Path $appDir 'storage') | Out-Null
          Copy-Item '${{ steps.runtime.outputs.phpdir }}' (Join-Path $appDir 'php') -Recurse
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile (Join-Path $appDir 'vc_redist.x64.exe')
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist ".env" copy ".example.env" ".env" >nul
          "php\php.exe" -v >nul 2>&1
          if errorlevel 1 (
            echo PHP failed to start. Run vc_redist.x64.exe as administrator once, then retry.
            exit /b 1
          )
          echo azpanel is listening on http://localhost:8000
          "php\php.exe" -S 0.0.0.0:8000 -t public public\router.php
          '@ | Set-Content -Encoding ascii (Join-Path $appDir 'start.cmd')
          $buildInfo = @(
            "azpanel $env:VERSION",
            "Source revision: ${{ github.sha }}",
            'Target host: Windows 11 ARM64',
            "PHP version: $(php -r 'echo PHP_VERSION;')",
            "PHP runtime architecture: ${{ steps.runtime.outputs.arch }}",
            'Runtime note: PHP x64 runs through Windows 11 ARM64 emulation when the reported architecture is x64.',
            'Container note: this ZIP is not a Docker image; Windows ARM64 containers are not supported by Docker on Windows ARM.',
            'Before starting, edit .env and configure the MySQL database.',
            'Run start.cmd, then open http://localhost:8000.'
          )
          $buildInfo | Set-Content -Encoding utf8 (Join-Path $appDir 'BUILD-INFO.txt')
          Push-Location $appDir
          try {
            & (Join-Path $appDir 'php\php.exe') think --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged application smoke test failed' }
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\azpanel-$env:VERSION-windows-arm64.zip"
          Compress-Archive -Path (Join-Path $appDir '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  azpanel-$env:VERSION-windows-arm64.zip" | Set-Content -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - prepare
      - build-linux
      - build-windows
      - package-windows-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and verify multi-OS multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for file in digests/*; do
            refs+=("$(tr -d '\r\n' < "$file")")
          done
          if [[ "${#refs[@]}" -ne 3 ]]; then
            echo "Expected 3 image digests, found ${#refs[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$REGISTRY_IMAGE:$VERSION" \
            --tag "$REGISTRY_IMAGE:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$REGISTRY_IMAGE:$VERSION" > manifest.json
          jq -e '
            [.manifests[].platform | (.os + "/" + .architecture)] as $platforms
            | ($platforms | index("linux/amd64") != null)
              and ($platforms | index("linux/arm64") != null)
              and ($platforms | index("windows/amd64") != null)
          ' manifest.json
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          notes="Docker image: $REGISTRY_IMAGE:$VERSION"$'\n\n'"Platforms: linux/amd64, linux/arm64, windows/amd64 (Windows Server 2022 LTSC)."$'\n\n'"Windows ARM64 is supplied as a ZIP program package, not a Docker image. Its PHP runtime architecture and emulation requirements are recorded in BUILD-INFO.txt."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --title "azpanel $VERSION" --notes "$notes"
            gh release upload "$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "azpanel $VERSION" \
              --notes "$notes"
          fi
